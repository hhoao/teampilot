name: Release Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch / tag / sha). Leave empty for current."
        required: false
        default: ""
      preview:
        description: "Publish a prerelease. Does not replace the Latest release."
        required: false
        type: boolean
        default: false

defaults:
  run:
    working-directory: client

# Repository secret TEAMPILOT_GITHUB_OAUTH_CLIENT_ID → compile-time
# GITHUB_OAUTH_CLIENT_ID (Actions forbids secrets named GITHUB_*).
env:
  TEAMPILOT_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.TEAMPILOT_GITHUB_OAUTH_CLIENT_ID }}

jobs:
  plan:
    name: Decide release channel
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.channel.outputs.tag }}
      prerelease: ${{ steps.channel.outputs.prerelease }}
      make_latest: ${{ steps.channel.outputs.make_latest }}
      publish: ${{ steps.channel.outputs.publish }}
      sha: ${{ steps.channel.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Resolve tag and channel
        id: channel
        # Workflow defaults run inside client/. This step reads the repo root.
        working-directory: ${{ github.workspace }}
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_INPUT_REF: ${{ github.event.inputs.ref }}
          RELEASE_PREVIEW: ${{ github.event.inputs.preview }}
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' client/pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          export PUBSPEC_VERSION="$version"
          export TAGS
          TAGS="$(git tag -l)"
          bash .github/scripts/release_channel.sh >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Resolved release channel:"
          cat "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux (deb + AppImage)
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Depth 1 asks GitHub for each submodule commit as a shallow ref.
          # That fails when the commit is not a branch tip.
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libnotify-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            dpkg fakeroot file libfuse2

      - name: Install appimagetool
        run: |
          wget -qO /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool
          appimagetool --version || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      - name: Activate fastforge
        working-directory: .
        run: |
          # After upstream https://github.com/fastforgedev/fastforge/pull/360 is on pub.dev:
          # dart pub global activate fastforge
          bash tool/activate_fastforge.sh

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      - name: Require GitHub OAuth client id
        run: |
          if [ -z "${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}" ]; then
            echo "Missing repository secret TEAMPILOT_GITHUB_OAUTH_CLIENT_ID" >&2
            exit 1
          fi

      - name: Package
        run: >
          fastforge package --platform linux --targets deb,appimage
          --build-dart-define=GITHUB_OAUTH_CLIENT_ID=${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: client/dist/**/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    needs: plan
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Depth 1 asks GitHub for each submodule commit as a shallow ref.
          # That fails when the commit is not a branch tip.
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      # A universal DMG needs a universal libcrypto: the tp_sshd crypto shim
      # links OpenSSL statically, and Homebrew's openssl@3 is host-arch only,
      # which drops the x86_64 slice of every binary that links it. Build both
      # slices and lipo them into one prefix the podspec picks up.
      - name: Build universal OpenSSL 3 (x86_64 + arm64)
        run: |
          set -euo pipefail
          version=3.5.9
          work="$RUNNER_TEMP/openssl-universal"
          rm -rf "$work" && mkdir -p "$work"
          curl -fsSL "https://www.openssl.org/source/openssl-${version}.tar.gz" |
            tar -xz -C "$work"
          src="$work/openssl-${version}"
          for arch in arm64 x86_64; do
            (
              cd "$src"
              make distclean >/dev/null 2>&1 || true
              ./Configure "darwin64-${arch}-cc" no-shared no-tests \
                --prefix="$work/$arch" >/dev/null
              make -j"$(sysctl -n hw.ncpu)" build_libs >/dev/null
              make install_dev >/dev/null
            )
          done
          mkdir -p "$work/universal/lib" "$work/universal/include"
          cp -R "$work/arm64/include/." "$work/universal/include/"
          lipo -create \
            "$work/arm64/lib/libcrypto.a" \
            "$work/x86_64/lib/libcrypto.a" \
            -output "$work/universal/lib/libcrypto.a"
          lipo -info "$work/universal/lib/libcrypto.a"
          echo "TEAMPILOT_OPENSSL_PREFIX=$work/universal" >> "$GITHUB_ENV"

      - name: Install fastforge + appdmg
        working-directory: .
        run: |
          # After upstream https://github.com/fastforgedev/fastforge/pull/360 is on pub.dev:
          # dart pub global activate fastforge
          bash tool/activate_fastforge.sh
          npm install -g appdmg

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      - name: Guard macOS Impeller off
        run: |
          # flutter build macos has no --no-enable-impeller; the .app reads
          # FLTEnableImpeller from Info.plist (copied into the DMG bundle).
          value=$(/usr/libexec/PlistBuddy -c 'Print :FLTEnableImpeller' macos/Runner/Info.plist)
          if [ "$value" != "false" ]; then
            echo "Expected FLTEnableImpeller=false in macos/Runner/Info.plist, got: $value" >&2
            exit 1
          fi

      - name: Require GitHub OAuth client id
        run: |
          if [ -z "${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}" ]; then
            echo "Missing repository secret TEAMPILOT_GITHUB_OAUTH_CLIENT_ID" >&2
            exit 1
          fi

      - name: Package
        env:
          # Flutter 3.50 flips macOSArm64Only on for stable builds; the pubspec
          # pin should already disable it, but a packaged build run by the
          # packaging tool must not depend on that resolution. Both levers are
          # explicit: the feature flag and the ARCHS xcodebuild receives.
          FLUTTER_MACOS_ARM64_ONLY: "false"
          FLUTTER_XCODE_ARCHS: "arm64 x86_64"
        run: >
          fastforge package --platform macos --targets dmg
          --build-dart-define=GITHUB_OAUTH_CLIENT_ID=${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}

      # Guard against a silent regression to arm64-only builds. Flutter plans to
      # default the macOSArm64Only flag to enabled, and CI pulls the latest stable,
      # so an arm64-only DMG can slip in and refuse to launch on Intel Macs.
      # client/pubspec.yaml pins enable-macos-arm64-only: false; this check makes
      # sure the main DMG actually is universal.
      - name: Verify main DMG is universal (x86_64 + arm64)
        shell: bash
        run: |
          set -euo pipefail
          dmg=$(find dist -type f -name '*-macos.dmg' -print -quit)
          if [ -z "$dmg" ]; then
            echo "No *-macos.dmg found under dist/" >&2
            exit 1
          fi
          echo "Verifying $dmg (must be universal)"
          mount_point=""
          trap 'if [ -n "$mount_point" ]; then hdiutil detach "$mount_point" -quiet 2>/dev/null || true; fi' EXIT
          mount_point=$(hdiutil attach -nobrowse -readonly "$dmg" | grep -o '/Volumes/.*' | head -1 | sed 's/[[:space:]]*$//')
          app=$(find "$mount_point" -maxdepth 1 -name 'TeamPilot.app' -print -quit)
          if [ -z "$app" ]; then
            echo "TeamPilot.app not found in DMG" >&2
            exit 1
          fi
          required=(
            "Contents/MacOS/TeamPilot"
            "Contents/Frameworks/App.framework/Versions/A/App"
            "Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"
          )
          failed=0
          for rel in "${required[@]}"; do
            bin="$app/$rel"
            if [ ! -f "$bin" ]; then
              echo "MISSING: $rel" >&2
              failed=1
              continue
            fi
            arches=$(lipo -info "$bin" 2>/dev/null | sed -E 's/.*are: //;s/.*architecture: //')
            echo "  $rel -> $arches"
            for needed in x86_64 arm64; do
              if ! echo "$arches" | grep -qw "$needed"; then
                echo "ERROR: $rel is missing the $needed slice" >&2
                failed=1
              fi
            done
          done
          if [ "$failed" -ne 0 ]; then
            echo "Main macOS DMG is not universal; refusing to publish." >&2
            echo "Ensure flutter.config.enable-macos-arm64-only stays false in client/pubspec.yaml." >&2
            exit 1
          fi
          echo "OK: main macOS DMG is universal (x86_64 + arm64)"

      # Also ship an arm64-only DMG for Apple Silicon users (smaller download).
      # Derived from the same universal .app via lipo -thin, so only one Flutter
      # build is needed. Re-sign ad-hoc after slicing (the original signature
      # no longer matches the binaries) and reuse the dmg packager spec.
      - name: Build arm64-only DMG from universal app
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          universal_dmg=$(find dist -type f -name '*-macos.dmg' -print -quit)
          # Absolute: appdmg runs from the temporary staging directory.
          out_dir=$(cd "$(dirname "$universal_dmg")" && pwd)
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # Locate the mounted volume via the attach output, robust to spaces in the name.
          mount_point=$(hdiutil attach -nobrowse -readonly "$universal_dmg" | grep -o '/Volumes/.*' | head -1 | sed 's/[[:space:]]*$//')
          cp -R "$mount_point/TeamPilot.app" "$work/TeamPilot.app"
          hdiutil detach "$mount_point" -quiet 2>/dev/null || true

          app="$work/TeamPilot.app"
          # Thin every universal Mach-O inside the bundle to arm64.
          find "$app/Contents/MacOS" "$app/Contents/Frameworks" -type f -print0 2>/dev/null \
            | xargs -0 -P 8 -I{} sh -c '
                file -b "$1" | grep -q "Mach-O universal binary" || exit 0
                tmp="$1.thin.$$"
                if lipo -thin arm64 "$1" -o "$tmp" 2>/dev/null && [ -s "$tmp" ]; then
                  mode=$(stat -f "%Lp" "$1")
                  mv -f "$tmp" "$1"; chmod "$mode" "$1"
                else
                  rm -f "$tmp"; echo "lipo -thin arm64 failed: $1" >&2; exit 1
                fi
              ' _ {}
          for rel in "Contents/MacOS/TeamPilot" \
                     "Contents/Frameworks/App.framework/Versions/A/App" \
                     "Contents/Frameworks/FlutterMacOS.framework/Versions/A/FlutterMacOS"; do
            arches=$(lipo -info "$app/$rel" 2>/dev/null | sed -E 's/.*are: //;s/.*architecture: //')
            echo "  arm64 slice $rel -> $arches"
            echo "$arches" | grep -qw arm64 || { echo "ERROR: $rel has no arm64 slice" >&2; exit 1; }
            echo "$arches" | grep -qw x86_64 && { echo "ERROR: $rel still has x86_64 slice" >&2; exit 1; }
          done
          codesign --force --deep --sign - "$app"

          # appdmg spec: reuse the committed make_config.yaml contents layout.
          cat > "$work/dmg.json" <<JSON
          {
            "title": "TeamPilot",
            "contents": [
              { "x": 480, "y": 170, "type": "link", "path": "/Applications" },
              { "x": 180, "y": 170, "type": "file", "path": "TeamPilot.app" }
            ]
          }
          JSON
          arm_dmg="$out_dir/teampilot-${version}-macos-arm64.dmg"
          (cd "$work" && appdmg dmg.json "$arm_dmg" --quiet)
          echo "Built $arm_dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-packages
          path: client/dist/**/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (MSIX + EXE + ZIP)
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Depth 1 asks GitHub for each submodule commit as a shallow ref.
          # That fails when the commit is not a branch tip.
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      - name: Activate fastforge
        shell: bash
        working-directory: .
        run: |
          # After upstream https://github.com/fastforgedev/fastforge/pull/360 is on pub.dev:
          # dart pub global activate fastforge
          bash tool/activate_fastforge.sh

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\Inno Setup 6"

      - name: Install Inno Chinese (Simplified) language file
        shell: pwsh
        run: |
          # choco innosetup 不含 ChineseSimplified.isl；从 jrsoftware/issrc 官方仓库取译稿（与 ISCC 的 Languages\ 路径一致）
          $langDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          $url = "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl"
          $out = Join-Path $langDir "ChineseSimplified.isl"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing
          if (-not (Test-Path -LiteralPath $out)) { throw "Failed to download ChineseSimplified.isl" }

      - name: Add pub-cache to PATH (Windows)
        shell: pwsh
        run: |
          # Prefer PUB_CACHE (set by flutter-action); fall back to LocalAppData.
          $bin = if ($env:PUB_CACHE) {
            Join-Path $env:PUB_CACHE 'bin'
          } else {
            Join-Path $env:LOCALAPPDATA 'Pub\Cache\bin'
          }
          Add-Content $env:GITHUB_PATH $bin
          Write-Host "Added to PATH: $bin"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      - name: Require GitHub OAuth client id
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TEAMPILOT_GITHUB_OAUTH_CLIENT_ID)) {
            throw 'Missing repository secret TEAMPILOT_GITHUB_OAUTH_CLIENT_ID'
          }

      # The Windows crypto shim links a static OpenSSL. The runner image has
      # vcpkg, but not this triplet, until we install it.
      - name: Install OpenSSL (vcpkg static)
        shell: pwsh
        run: |
          $root = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { 'C:\vcpkg' }
          & "$root\vcpkg.exe" install openssl:x64-windows-static
          $prefix = Join-Path $root 'installed\x64-windows-static'
          $header = Join-Path $prefix 'include\openssl\evp.h'
          if (-not (Test-Path -LiteralPath $header)) {
            throw "OpenSSL headers missing: $header"
          }
          "OPENSSL_ROOT_DIR=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OPENSSL_USE_STATIC_LIBS=TRUE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Use pwsh (not bash): dart pub global shims are fastforge.bat on Windows;
      # Git Bash does not resolve .bat → "fastforge: command not found".
      - name: Package Windows (ZIP + MSIX)
        shell: pwsh
        run: >
          fastforge package --platform windows --targets zip,msix
          --build-dart-define=GITHUB_OAUTH_CLIENT_ID=$env:TEAMPILOT_GITHUB_OAUTH_CLIENT_ID

      - name: Package Windows (EXE installer)
        shell: pwsh
        run: >
          fastforge package --platform windows --targets exe
          --build-dart-define=GITHUB_OAUTH_CLIENT_ID=$env:TEAMPILOT_GITHUB_OAUTH_CLIENT_ID

      - name: Verify Windows release files
        shell: pwsh
        run: |
          $m = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          if (-not $m) { throw "Could not read version from pubspec.yaml" }
          $d = Join-Path "dist" $m
          if (-not (Test-Path -LiteralPath $d)) { throw "Missing directory: $d" }
          $zip = @(Get-ChildItem -LiteralPath $d -File | Where-Object { $_.Name -like '*-windows.zip' })
          $msix = @(Get-ChildItem -LiteralPath $d -File | Where-Object { $_.Name -like '*.msix' })
          # Inno 安装包：同级目录下的 *setup.exe；排除 *setup_exe\ 暂存目录里的 TeamPilot.exe
          $setup = @(Get-ChildItem -LiteralPath $d -File | Where-Object { $_.Name -like '*setup.exe' })
          if ($setup.Count -lt 1) {
            $setup = @(Get-ChildItem -Path "dist" -Recurse -File | Where-Object {
              $_.Name -like '*setup.exe' -and $_.FullName -notmatch 'setup_exe[/\\]'
            })
          }
          if ($zip.Count -lt 1) { throw "Missing *-windows.zip under $d" }
          if ($msix.Count -lt 1) { throw "Missing *.msix under $d" }
          if ($setup.Count -lt 1) {
            Write-Host "Contents of $d :"
            Get-ChildItem -LiteralPath $d -Force | ForEach-Object { Write-Host "  $($_.Name)" }
            throw "Missing *setup.exe (Inno installer). Expected under $d or dist (excluding *setup_exe staging)."
          }

      - name: Upload dist snapshot (job failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist-snapshot
          path: client/dist
          if-no-files-found: ignore

      - name: List packaged Windows files (debug)
        shell: pwsh
        run: Get-ChildItem -Recurse -File dist | ForEach-Object { "$($_.FullName) $($_.Length)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            client/dist/**/*.msix
            client/dist/**/*.exe
            client/dist/**/*.zip
          if-no-files-found: error

  build-android:
    name: Build Android (APK arm + arm64)
    needs: plan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # Depth 1 asks GitHub for each submodule commit as a shallow ref.
          # That fails when the commit is not a branch tip.
          fetch-depth: 0
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      # AGP 9.3 lint calls List.removeLast. JDK 17 does not have that method.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Require GitHub OAuth client id
        run: |
          if [ -z "${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}" ]; then
            echo "Missing repository secret TEAMPILOT_GITHUB_OAUTH_CLIENT_ID" >&2
            exit 1
          fi

      # fastforge 在 split-per-abi 时只会复制一个 APK 到 dist/，故直接用 flutter build 并分别归档
      - name: Build Android (split APK per ABI)
        run: |
          flutter build apk --release \
            --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define=GITHUB_OAUTH_CLIENT_ID="${TEAMPILOT_GITHUB_OAUTH_CLIENT_ID}"
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          dist_dir="dist/${version}"
          mkdir -p "$dist_dir"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "${dist_dir}/teampilot-${version}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "${dist_dir}/teampilot-${version}-arm64-v8a.apk"

      - name: Verify Android release APKs
        run: |
          version=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/version:[[:space:]]*//')
          dist_dir="dist/${version}"
          test -f "${dist_dir}/teampilot-${version}-armeabi-v7a.apk"
          test -f "${dist_dir}/teampilot-${version}-arm64-v8a.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-packages
          path: client/dist/**/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [plan, build-linux, build-macos, build-windows, build-android]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-files
          python3 << 'PY'
          import os, shutil, pathlib, sys
          artifacts = pathlib.Path("artifacts")
          out = pathlib.Path("release-files")
          out.mkdir(parents=True, exist_ok=True)
          suffixes = (".deb", ".appimage", ".dmg", ".msix", ".exe", ".zip", ".apk")
          # flutter_app_packager 临时目录：…/teampilot-*-windows-setup_exe/TeamPilot.exe 等，不是发布物
          staging_suffixes = ("_exe", "_msix", "_zip", "_deb", "_dmg", "_appimage", "_apk")
          expected_release_files = 9  # linux×2 + macos×2 (universal + arm64) + windows×3 + android×2

          def is_inside_packaging_staging(path: pathlib.Path) -> bool:
              return any(
                  part.endswith(staging_suffixes) for part in path.parts[:-1]
              )

          all_files = []
          for root, _dirs, files in os.walk(artifacts):
              for name in files:
                  p = pathlib.Path(root) / name
                  if is_inside_packaging_staging(p):
                      continue
                  low = name.lower()
                  if not any(low.endswith(s) for s in suffixes):
                      continue
                  # 只收录 Inno 安装包（*-setup.exe），排除 Runner 内的 TeamPilot.exe 等
                  if low.endswith(".exe") and "-setup" not in low:
                      continue
                  all_files.append(p)
          print("Matched artifact files:")
          for p in sorted(all_files, key=lambda x: str(x)):
              print(" ", p)
          if len(all_files) != expected_release_files:
              print(
                  f"ERROR: expected exactly {expected_release_files} release binaries under artifacts/, found {len(all_files)}",
                  file=sys.stderr,
              )
              sys.exit(1)
          for p in all_files:
              dest = out / p.name
              if dest.exists() and dest.resolve() != p.resolve():
                  print("WARN: duplicate basename, overwriting:", p.name, "<-", p)
              shutil.copy2(p, dest)
          copied = sorted(out.iterdir())
          print("release-files:")
          for f in copied:
              print(f"  {f.name}  {f.stat().st_size}")
          if len(copied) != expected_release_files:
              print(
                  f"ERROR: expected exactly {expected_release_files} files in release-files/",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Point notes at this release tag
        run: |
          set -euo pipefail
          tag="${{ needs.plan.outputs.tag }}"
          sha="${{ needs.plan.outputs.sha }}"
          if ! git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Release $tag" "$sha"
          fi

      - name: Generate release notes (Conventional Commits)
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          args: --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: release-notes.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ needs.plan.outputs.sha }}
          prerelease: ${{ needs.plan.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.plan.outputs.make_latest }}
          files: release-files/*
          body_path: ${{ steps.git-cliff.outputs.changelog }}
          fail_on_unmatched_files: true
