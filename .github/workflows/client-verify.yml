name: Client Build Verify

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - "tools/mock_model_gateway/**"
      - "tool/flutter_patches/**"
      - ".gitmodules"
      - ".github/workflows/client-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/auto-tag.yml"
      - ".github/actions/apply-flutter-patches/**"
  pull_request:
    paths:
      - "client/**"
      - "tools/mock_model_gateway/**"
      - "tool/flutter_patches/**"
      - ".gitmodules"
      - ".github/workflows/client-verify.yml"
      - ".github/workflows/release.yml"
      - ".github/workflows/auto-tag.yml"
      - ".github/actions/apply-flutter-patches/**"

concurrency:
  group: client-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  verify:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
            platform: linux
            install_linux_deps: true
            package_deb: true
          - os: windows-latest
            label: Windows
            platform: windows
            install_linux_deps: false
            package_deb: false
          - os: macos-latest
            label: macOS
            platform: macos
            install_linux_deps: false
            package_deb: false
          - os: ubuntu-22.04
            label: Android
            platform: android
            install_linux_deps: false
            package_deb: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev \
            libnotify-dev \
            libwebkit2gtk-4.0-dev libsoup2.4-dev \
            dpkg fakeroot file

      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      - name: Accept Android SDK licenses
        if: matrix.platform == 'android'
        run: yes | flutter doctor --android-licenses

      - name: Activate fastforge
        if: matrix.package_deb
        working-directory: .
        run: |
          # After upstream https://github.com/fastforgedev/fastforge/pull/360 is on pub.dev:
          # dart pub global activate fastforge
          bash tool/activate_fastforge.sh

      - name: Add pub-cache to PATH
        if: matrix.package_deb
        run: echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: teampilot_search Rust tests
        working-directory: client/packages/teampilot_search
        run: cargo test --manifest-path rust/Cargo.toml

      - name: teampilot_search Dart tests
        working-directory: client/packages/teampilot_search
        run: flutter test

      - name: teampilot_search analyze
        working-directory: client/packages/teampilot_search
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit and widget tests
        run: flutter test --exclude-tags integration

      - name: Build Android APK (debug, teampilot_search cdylib cross-compile)
        if: matrix.platform == 'android'
        run: flutter build apk --debug

  integration-linux:
    name: Linux integration (Claude PTY + Docker SSH)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake git ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev libnotify-dev \
            libwebkit2gtk-4.0-dev libsoup2.4-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: ./.github/actions/apply-flutter-patches

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Sync bundled Google Fonts (Noto Sans SC)
        run: dart run tool/sync_bundled_google_fonts.dart

      - name: Generate native splash sources
        run: dart run native_splash_screen_cli gen

      - name: Build Linux (PTY native lib)
        run: flutter build linux --debug

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build mixed Docker image (cached)
        uses: docker/build-push-action@v6
        with:
          context: client/test/integration/docker
          file: client/test/integration/docker/Dockerfile.mixed
          tags: teampilot-it-ssh-mixed:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Mixed team Claude integration tests (L2 + L3)
        env:
          LD_LIBRARY_PATH: build/linux/x64/debug/bundle/lib
        run: flutter test --tags "integration && linux-pty" --concurrency=1

      # Real codex boots the session-materialized config.toml (provider +
      # managed agent-status/bus hooks). Installed to a private prefix so the
      # matrix bucket above never discovers codex cells (those need a signed-in
      # or mock-provider turn flow and are tracked separately).
      - name: Codex config materialize integration (real codex loads product TOML)
        env:
          LD_LIBRARY_PATH: build/linux/x64/debug/bundle/lib
        run: |
          npm install -g --prefix /opt/codex-cli @openai/codex
          PATH="/opt/codex-cli/bin:$PATH" flutter test \
            test/integration/codex_config_materialize_launch_integration_test.dart \
            --tags "integration && linux-pty"
