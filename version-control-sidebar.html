<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Version Control — Changes</title>
  <style>
    :root {
      --bg: #2b2d30;
      --bg-panel: #1e1f22;
      --bg-hover: #2e436e;
      --bg-selected: #2d4a75;
      --text: #bcbec4;
      --text-dim: #6f737a;
      --text-file: #589df6;
      --border: #393b40;
      --icon: #a1a3a8;
      --checkbox-border: #6f737a;
      --icon-interface: #62b543;
      --icon-class: #40b6e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      background: #121214;
      font-family: "JetBrains Mono", "SF Mono", "Cascadia Mono", "Menlo",
        "Consolas", "Liberation Mono", monospace;
      font-size: 13px;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .panel {
      width: 100%;
      max-width: 720px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 6px 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 3px;
      background: transparent;
      color: var(--icon);
      cursor: pointer;
    }

    .toolbar-btn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #dfe1e5;
    }

    .toolbar-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .toolbar-spacer {
      flex: 1;
    }

    /* Tree */
    .tree {
      padding: 4px 0 12px;
      user-select: none;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 22px;
      padding: 1px 8px 1px 0;
      line-height: 20px;
      white-space: nowrap;
      cursor: default;
    }

    .row:hover:not(.selected) {
      background: rgba(255, 255, 255, 0.04);
    }

    .row.selected {
      background: var(--bg-selected);
    }

    .row.selected:hover {
      background: var(--bg-selected);
    }

    .chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-dim);
      cursor: pointer;
    }

    .chevron svg {
      width: 10px;
      height: 10px;
      fill: currentColor;
      transition: transform 0.12s ease;
    }

    .chevron.collapsed svg {
      transform: rotate(-90deg);
    }

    .chevron.hidden {
      visibility: hidden;
    }

    .checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      flex-shrink: 0;
      margin: 0;
      border: 1px solid var(--checkbox-border);
      border-radius: 2px;
      background: transparent;
      cursor: pointer;
      position: relative;
    }

    .checkbox:checked {
      background: #3574f0;
      border-color: #3574f0;
    }

    .checkbox:checked::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 0;
      width: 4px;
      height: 8px;
      border: solid #fff;
      border-width: 0 1.5px 1.5px 0;
      transform: rotate(45deg);
    }

    .folder-icon,
    .file-icon {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .folder-icon svg {
      width: 14px;
      height: 14px;
      fill: #c9a26c;
    }

    .file-icon {
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1e1f22;
      line-height: 1;
    }

    .file-icon.interface {
      background: var(--icon-interface);
    }

    .file-icon.class {
      background: var(--icon-class);
    }

    .label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .label.muted {
      color: var(--text-dim);
    }

    .label.group {
      color: var(--text);
      font-weight: 500;
    }

    .label.file {
      color: var(--text-file);
    }

    .label.folder-path {
      color: var(--text);
    }

    .count {
      color: var(--text-dim);
      margin-left: 6px;
      font-weight: 400;
    }

    /* Indent helpers: each level ~16px after chevron column */
    .indent-0 { padding-left: 4px; }
    .indent-1 { padding-left: 20px; }
    .indent-2 { padding-left: 36px; }
    .indent-3 { padding-left: 52px; }
    .indent-4 { padding-left: 68px; }

    .children.collapsed {
      display: none;
    }
  </style>
</head>
<body>
  <div class="panel" role="tree" aria-label="Local Changes">
    <div class="toolbar" role="toolbar" aria-label="Version control actions">
      <button class="toolbar-btn" title="Refresh" aria-label="Refresh">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.4-3.6"/><path d="M13.5 2.5v4h-4"/></svg>
      </button>
      <button class="toolbar-btn" title="Rollback" aria-label="Rollback">
        <svg viewBox="0 0 16 16"><path d="M5 5H3.5A2.5 2.5 0 0 0 1 7.5v0A2.5 2.5 0 0 0 3.5 10H12"/><path d="M9 3l3 3-3 3"/></svg>
      </button>
      <button class="toolbar-btn" title="Show Diff with Working Tree" aria-label="Show Diff">
        <svg viewBox="0 0 16 16"><path d="M4 3h4.5L12 6.5V13H4z"/><path d="M8.5 3v3.5H12"/></svg>
      </button>
      <button class="toolbar-btn" title="Group By" aria-label="Group By">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M4 8h10M6 12h8"/></svg>
      </button>
      <button class="toolbar-btn" title="Show History" aria-label="Show History">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.5l2.5 1.5"/></svg>
      </button>
      <button class="toolbar-btn" title="Preview Diff" aria-label="Preview Diff">
        <svg viewBox="0 0 16 16"><path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8s-2.5 4.5-6.5 4.5S1.5 8 1.5 8z"/><circle cx="8" cy="8" r="1.8"/></svg>
      </button>
      <button class="toolbar-btn" title="Locate" aria-label="Locate">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2"/><path d="M8 1.5v2.5M8 12v2.5M1.5 8h2.5M12 8h2.5"/></svg>
      </button>
      <button class="toolbar-btn" title="Expand All" aria-label="Expand All">
        <svg viewBox="0 0 16 16"><path d="M3 6l5 5 5-5"/></svg>
      </button>
      <span class="toolbar-spacer"></span>
      <button class="toolbar-btn" title="Close" aria-label="Close">
        <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>

    <div class="tree">
      <!-- Changes -->
      <div class="group" data-group>
        <div class="row indent-0" data-toggle>
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
          </span>
          <input class="checkbox" type="checkbox" aria-label="Select Changes" />
          <span class="label group">Changes<span class="count">2 files</span></span>
        </div>

        <div class="children">
          <div class="row indent-1 selected" data-toggle>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
            </span>
            <input class="checkbox" type="checkbox" aria-label="Select 2 files group" />
            <span class="folder-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
            </span>
            <span class="label muted">2 files</span>
          </div>

          <div class="children">
            <div class="row indent-2" data-toggle>
              <span class="chevron" aria-hidden="true">
                <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
              </span>
              <input class="checkbox" type="checkbox" aria-label="Select domain path" />
              <span class="folder-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
              </span>
              <span class="label folder-path">domain/core/src/main/java/com/quanzhi</span>
            </div>

            <div class="children">
              <div class="row indent-3">
                <span class="chevron hidden" aria-hidden="true">
                  <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
                </span>
                <input class="checkbox" type="checkbox" aria-label="Select TableLabelResultRepository.java" />
                <span class="file-icon interface" title="Interface" aria-hidden="true">I</span>
                <span class="label file">TableLabelResultRepository.java</span>
              </div>
            </div>

            <div class="row indent-2" data-toggle>
              <span class="chevron" aria-hidden="true">
                <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
              </span>
              <input class="checkbox" type="checkbox" aria-label="Select infrastructure path" />
              <span class="folder-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
              </span>
              <span class="label folder-path">infrastructure/repo-ch/src/main/java/com</span>
            </div>

            <div class="children">
              <div class="row indent-3">
                <span class="chevron hidden" aria-hidden="true">
                  <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
                </span>
                <input class="checkbox" type="checkbox" aria-label="Select TableLabelResultRepositoryImpl.java" />
                <span class="file-icon class" title="Class" aria-hidden="true">C</span>
                <span class="label file">TableLabelResultRepositoryImpl.java</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Unversioned Files -->
      <div class="group" data-group>
        <div class="row indent-0" data-toggle>
          <span class="chevron" aria-hidden="true">
            <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
          </span>
          <input class="checkbox" type="checkbox" aria-label="Select Unversioned Files" />
          <span class="label group">Unversioned Files<span class="count">4 files</span></span>
        </div>

        <div class="children">
          <div class="row indent-1" data-toggle>
            <span class="chevron" aria-hidden="true">
              <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
            </span>
            <input class="checkbox" type="checkbox" aria-label="Select unversioned group" />
            <span class="folder-icon" aria-hidden="true">
              <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
            </span>
            <span class="label muted">4 files</span>
          </div>

          <div class="children">
            <div class="row indent-2">
              <span class="chevron collapsed" aria-hidden="true">
                <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
              </span>
              <input class="checkbox" type="checkbox" aria-label="Select .teampilot-inbox" />
              <span class="folder-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
              </span>
              <span class="label folder-path">.teampilot-inbox<span class="count">1 file</span></span>
            </div>

            <div class="row indent-2">
              <span class="chevron collapsed" aria-hidden="true">
                <svg viewBox="0 0 10 10"><path d="M2 3.5 L5 7 L8 3.5"/></svg>
              </span>
              <input class="checkbox" type="checkbox" aria-label="Select META-INF" />
              <span class="folder-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16"><path d="M1.5 3.5h4.2l1.3 1.5H14.5v8H1.5z"/></svg>
              </span>
              <span class="label folder-path">META-INF<span class="count">3 files</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Row selection highlight
    document.querySelectorAll(".row").forEach((row) => {
      row.addEventListener("click", (e) => {
        if (e.target.closest("input, .chevron")) return;
        document.querySelectorAll(".row.selected").forEach((r) => r.classList.remove("selected"));
        row.classList.add("selected");
      });
    });

    // Expand / collapse on chevron or data-toggle rows with children
    document.querySelectorAll("[data-toggle]").forEach((row) => {
      const chevron = row.querySelector(".chevron:not(.hidden)");
      if (!chevron) return;

      const toggle = (e) => {
        if (e.target.closest("input")) return;
        if (e.target.closest(".chevron") || e.currentTarget === row) {
          // only collapse when clicking chevron, not whole row text
          if (!e.target.closest(".chevron") && e.type === "click" && e.currentTarget === row) {
            return;
          }
        }
        const children = row.nextElementSibling;
        if (!children || !children.classList.contains("children")) return;
        const collapsed = children.classList.toggle("collapsed");
        chevron.classList.toggle("collapsed", collapsed);
      };

      chevron.addEventListener("click", (e) => {
        e.stopPropagation();
        const children = row.nextElementSibling;
        if (!children || !children.classList.contains("children")) return;
        const collapsed = children.classList.toggle("collapsed");
        chevron.classList.toggle("collapsed", collapsed);
      });
    });
  </script>
</body>
</html>
