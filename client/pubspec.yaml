name: teampilot
description: "A team-oriented and easy-to-use desktop client packaged based on the terminal AI Agent"
publish_to: 'none'

version: 3.5.0

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  collection: ^1.19.0
  desktop_drop: ^0.7.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.2.0
  re_editor:
    path: packages/re-editor
  flutter_alacritty:
    path: packages/flutter_alacritty
  flutter_pty_new:
    path: packages/flutter_pty_new
  dartssh2:
    path: packages/dartssh2
  ai_message_core:
    path: packages/ai_message_core
  ai_message_ui:
    path: packages/ai_message_ui
  system_fonts:
    path: packages/system_fonts
  teampilot_tree_sitter:
    path: packages/teampilot_tree_sitter
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.5
  toastification:
    path: packages/toastification
  go_router: ^16.3.0
  path_provider: ^2.1.2
  path: ^1.9.0
  toml: ^0.18.0
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  window_manager: ^0.5.1
  web_socket_channel: ^2.4.0
  logger: ^2.6.0
  file_picker: ^9.0.0
  speech_to_text: ^7.0.0
  url_launcher: ^6.3.2
  infinite_scroll_pagination: ^5.1.1
  http: ^1.6.0
  package_info_plus: ^8.3.0
  pub_semver: ^2.2.0
  android_package_installer: ^0.0.3
  crypto: ^3.0.7
  archive: ^4.0.9
  toggle_switch: ^2.3.0
  google_fonts: ^8.1.0
  flex_color_scheme: ^8.4.0
  flutter_animate: 4.5.2
  sqlite3: ^3.3.1
  timezone: ^0.10.0
  synchronized: ^3.3.1
  meta: ^1.16.0
  flutter_svg: ^2.3.0
  intl: any
  native_splash_screen:
    path: packages/native_splash_screen/native_splash_screen
  provider: any
  mocktail: ^1.0.5
  flutter_local_notifications: ^20.1.0
  flutter_native_splash: any
  pasteboard: ^0.5.0
  flutter_markdown_plus:
    path: packages/flutter_markdown_plus
  panes: ^1.3.0
  photo_view: ^0.15.0
dependency_overrides:
  flutter_pty_new:
    path: packages/flutter_pty_new
  rust_lib_flutter_alacritty:
    path: packages/flutter_alacritty/packages/rust_lib_flutter_alacritty

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.6.0
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4
  rename_app: ^1.6.6
  fake_async: ^1.3.1
  flutter_rust_bridge: ^2.12.0

  mock_anthropic:
    path: ../tools/mock_anthropic
  native_splash_screen_cli:
    path: packages/native_splash_screen/native_splash_screen_cli
  vm_service_protos: ^2.0.1
  integration_test:
    sdk: flutter
  vm_service: ^15.2.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - google_fonts/
    - assets/icons/
    - assets/file_icons/
    - assets/providers/
    - assets/geometry/
    - assets/editor_languages/json/
    - assets/editor_languages/dart/
    - assets/editor_languages/yaml/
    - assets/editor_languages/markdown/
    - assets/editor_languages/python/
    - assets/editor_languages/rust/
    - assets/editor_languages/typescript/
    - assets/editor_languages/bash/
    - assets/editor_languages/xml/
    - assets/editor_languages/toml/
    - assets/editor_languages/css/
    - assets/fonts/terminal/
    - assets/rtk/rtk-rewrite.sh
    - assets/rtk/rtk-rewrite.ps1
    - assets/hooks/teampilot-deny-team-lead-self-message.sh
    - assets/hooks/teampilot-deny-team-lead-self-message.ps1
    - assets/hooks/teampilot-team-lead-delegate-only.sh
    - assets/hooks/teampilot-team-lead-delegate-only.ps1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/icon_bg.png
  android: true
  ios: false
  android_12:
    color: "#FFFFFF"
    image: assets/icons/icon_bg.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon_bg.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/icons/icon_bg.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icons/icon_bg.png
